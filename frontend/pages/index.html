<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genesis Twin</title>
<style>
:root{--bg:#060b17;--p1:rgba(255,255,255,.035);--p2:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--text:#e7ecf6;--mute:#8d9bb8;--acc:#5eead4;--acc2:#8b9cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;background:radial-gradient(1100px 500px at 85% -10%,rgba(139,156,255,.14),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(94,234,212,.09),transparent 55%),var(--bg);min-height:100vh}
.mono{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{display:flex;flex-direction:column;gap:2px;padding:18px 12px;border-right:1px solid var(--line);background:rgba(6,11,23,.7);position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;padding:4px 10px 18px;font-weight:600;letter-spacing:.2px}
.brand small{color:var(--mute);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--acc2));margin-bottom:10px}
.nv{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mute);font-size:14px;border-left:2px solid transparent}
.nv:hover{background:var(--p1);color:var(--text)}
.nv.on{background:var(--p2);color:var(--text);border-left-color:var(--acc)}
.grow{flex:1}
.col{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(6,11,23,.8);backdrop-filter:blur(8px);z-index:5}
.crumb{font-size:13px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mute)}
main{padding:28px;max-width:1120px;width:100%}
h1{font-size:44px;line-height:1.08;letter-spacing:-.02em;margin:.2em 0 .3em;font-weight:650}
h2{font-size:20px;margin:1.2em 0 .5em;font-weight:600;letter-spacing:-.01em}
p{color:var(--mute);line-height:1.6;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hero{padding:26px 0 18px}
.btn{background:var(--p1);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--p2)}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04101c;border:0;font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tiles,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile,.card,.organ,.panel{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{font-weight:600}.tile p{margin:.4em 0 0;font-size:13.5px}
.card small{color:var(--mute);display:block;margin-top:5px;font-size:12.5px}
.organ{display:flex;gap:12px;align-items:flex-start}
.organ b{text-transform:capitalize;display:block}
.st{font-size:12px;display:block;margin-bottom:6px}
.vit{display:grid;gap:2px;font-size:12px;color:var(--mute)}
.vit div{display:flex;justify-content:space-between;gap:12px}
.vit .mono{color:var(--text)}
.split{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:start}
.sys{display:flex;flex-direction:column;gap:2px}
.sys button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--mute);font-size:13.5px}
.sys button:hover{background:var(--p1)}.sys button.on{background:var(--p2);color:var(--text)}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);min-width:150px}
input,select{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=range]{padding:0;accent-color:var(--acc)}
.err{color:var(--bad)}.ok{color:var(--ok)}
.tag{font-size:12px;color:var(--mute)}
.pre{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px}
.disc{margin-top:auto;padding:10px 28px;border-top:1px solid var(--line);font-size:12px;color:#c9a95a;background:rgba(251,191,36,.04)}
.ex{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.ex>.stick{position:sticky;top:70px}
.split2{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.plan{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:20px}
.plan.rec{border-color:rgba(94,234,212,.5);background:linear-gradient(180deg,rgba(94,234,212,.07),var(--p1))}
.plan ul{padding-left:18px;color:var(--mute);line-height:1.8;font-size:14px}
.big{font-size:30px;font-weight:650;letter-spacing:-.02em}
@media(max-width:980px){.ex,.split2{grid-template-columns:1fr}.ex>.stick{position:static}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.split{grid-template-columns:1fr}h1{font-size:32px}}
@media print{.side,.top,.btn{display:none}.shell{display:block}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
