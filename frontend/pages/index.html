<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genesis Twin</title>
<style>
:root{--bg:#0b1426;--panel:#14213d;--line:#2a3b61;--text:#e8edf7;--mute:#9fb0cf;--accent:#4f8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif}
.banner{background:#3a2a00;color:#ffd98a;padding:6px 12px;font-size:13px;text-align:center}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button,.btn{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
nav button.on,.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1000px;margin:0 auto;padding:18px}
h1,h2{margin:.3em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:10px}
.card small{color:var(--mute);display:block;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px}
.err{color:#ff8a8a}.ok{color:#7ee2a8}.tag{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mute)}
.pre{background:var(--panel);border-radius:8px;padding:10px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
