name: Weekly Research Paper Fetch

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  fetch-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Fetch research papers
        run: |
          python research/fetch_papers.py

      - name: Save fetched papers as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-papers-${{ github.run_number }}
          path: research/data/papers.json
          if-no-files-found: error
          retention-days: 30